# Golden copy of the operator's Secret access in config/rbac/*.yaml (plan
# #155 G2, S9). rbac_test.go compares the manifests with it. A change here
# needs a security review of the operator's Secret access.
# rules: every rule of a Role or ClusterRole that can grant access to core
# Secrets. bindings: every binding of such a role, and every binding of a role
# that config/rbac does not define. Keys name the file, the kind, and the
# object.
rules:
  role.yaml ClusterRole manager-role:
  - apiGroups:
    - ""
    resources:
    - secrets
    - serviceaccounts
    - services
    verbs:
    - create
    - delete
    - get
    - list
    - patch
    - update
    - watch
bindings:
  clusterrolebinding.yaml ClusterRoleBinding coder-k8s:
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: manager-role
    subjects:
    - kind: ServiceAccount
      name: coder-k8s
      namespace: coder-system
  auth-delegator-binding.yaml ClusterRoleBinding coder-k8s-auth-delegator:
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: system:auth-delegator
    subjects:
    - kind: ServiceAccount
      name: coder-k8s
      namespace: coder-system
  authentication-reader-binding.yaml RoleBinding kube-system/coder-k8s-authentication-reader:
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: extension-apiserver-authentication-reader
    subjects:
    - kind: ServiceAccount
      name: coder-k8s
      namespace: coder-system
