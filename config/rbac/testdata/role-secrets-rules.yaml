# Golden copy of every rule in config/rbac/role.yaml that can grant access to
# core Secrets (plan #155 G2, S9). rbac_test.go compares the role with it.
# A change here needs a security review of the operator's Secret access.
- apiGroups:
  - ""
  resources:
  - secrets
  - serviceaccounts
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
