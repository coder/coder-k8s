# Lets namespace users read the CoderWorkspacePoolMember objects that the pool controller makes. The built-in view
# and edit roles (and so admin) aggregate it. Users get no write verb on members (#153 threat T4): only the operator
# creates and changes them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: coder-k8s-coderworkspacepoolmember-viewer
  labels:
    rbac.authorization.k8s.io/aggregate-to-view: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
rules:
  - apiGroups:
      - coder.com
    resources:
      - coderworkspacepoolmembers
    verbs:
      - get
      - list
      - watch
