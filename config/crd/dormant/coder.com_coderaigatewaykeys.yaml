---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: coderaigatewaykeys.coder.com
spec:
  group: coder.com
  names:
    kind: CoderAIGatewayKey
    listKind: CoderAIGatewayKeyList
    plural: coderaigatewaykeys
    singular: coderaigatewaykey
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.secretName
      name: Secret
      type: string
    - jsonPath: .status.currentKey.name
      name: Current
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.nextRotationTime
      name: Next rotation
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          CoderAIGatewayKey manages a Coder AI Gateway key for standalone AI Gateway
          replicas and stores it in a Secret that this object owns. A gateway key
          lets its holder load the API key of every enabled AI provider, so write
          access to this kind is admin-only. Deleting the object revokes every key
          that it created at once, and gateways that use them stop within a minute.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: CoderAIGatewayKeySpec defines a Coder AI Gateway key and
              its rotation.
            properties:
              controlPlaneRef:
                description: |-
                  ControlPlaneRef names the CoderControlPlane in the same namespace. The
                  controller creates and deletes keys with that control plane's operator
                  token. The control plane must allow keys in spec.aiGateway.allowKeys.
                properties:
                  name:
                    description: Name is the CoderControlPlane name.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: controlPlaneRef is immutable
                  rule: self == oldSelf
              rotation:
                default: {}
                description: |-
                  Rotation configures when the controller replaces the key and how long a
                  replaced key stays valid.
                properties:
                  consumerWaitSeconds:
                    default: 86400
                    description: |-
                      ConsumerWaitSeconds is how long after the grace period the controller
                      keeps a replaced key while Coder still reports connections that use it.
                      After that time the controller deletes the key, and gateways that still
                      use it exit and restart with the key from the Secret. 0 deletes the key
                      when the grace period ends. At most 7 days, default 1 day.
                    format: int32
                    maximum: 604800
                    minimum: 0
                    type: integer
                  gracePeriodSeconds:
                    default: 3600
                    description: |-
                      GracePeriodSeconds is the minimum time between writing a new key to the
                      Secret and deleting the replaced key in Coder. Consumers must reload
                      within it. Between 10 minutes and 7 days, default 1 hour.
                    format: int32
                    maximum: 604800
                    minimum: 600
                    type: integer
                  intervalSeconds:
                    default: 2592000
                    description: |-
                      IntervalSeconds is the time between scheduled rotations, counted from
                      the time the current key was written to the Secret. 0 turns scheduled
                      rotation off. Otherwise it is between 1 day and 365 days. The default is
                      30 days, because Coder keys never expire.
                    format: int32
                    maximum: 31536000
                    minimum: 0
                    type: integer
                    x-kubernetes-validations:
                    - message: intervalSeconds must be 0 or at least 86400 (1 day)
                      rule: self == 0 || self >= 86400
                  trigger:
                    description: |-
                      Trigger starts one rotation each time it changes to a new non-empty
                      value. The value set when the object is created starts no rotation.
                    maxLength: 63
                    type: string
                type: object
                x-kubernetes-validations:
                - message: gracePeriodSeconds must be shorter than intervalSeconds
                  rule: '!has(self.intervalSeconds) || !has(self.gracePeriodSeconds)
                    || self.intervalSeconds == 0 || self.gracePeriodSeconds < self.intervalSeconds'
              secretName:
                description: |-
                  SecretName is the Secret in the same namespace that receives the key,
                  under the data key "key". The controller creates the Secret and owns it.
                  It never writes a Secret that already exists and that this object does
                  not own. To move the key to another Secret, delete and re-create this
                  object.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
                x-kubernetes-validations:
                - message: secretName is immutable
                  rule: self == oldSelf
            required:
            - controlPlaneRef
            - secretName
            type: object
          status:
            description: |-
              CoderAIGatewayKeyStatus defines the observed state of a CoderAIGatewayKey.
              It holds Coder key IDs, names, serials, and times only. It never holds a
              key, a key prefix, a hash, or a masked key.
            properties:
              appliedGeneration:
                description: |-
                  AppliedGeneration is the last generation that the controller fully
                  applied. A spec change re-arms a stall that waits for one.
                format: int64
                type: integer
              conditions:
                description: Conditions are Ready, Reconciling, and Stalled.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              consecutiveIssueFailures:
                description: |-
                  ConsecutiveIssueFailures counts create requests in a row whose outcome
                  was uncertain, and failed Secret writes. A success resets it.
                format: int32
                minimum: 0
                type: integer
              currentKey:
                description: CurrentKey is the key that the output Secret holds.
                properties:
                  id:
                    description: ID is the Coder key ID. It is not the key.
                    format: uuid
                    maxLength: 36
                    type: string
                  issuedAt:
                    description: IssuedAt is when the controller wrote the key to
                      the Secret.
                    format: date-time
                    type: string
                  name:
                    description: Name is the Coder key name.
                    maxLength: 64
                    type: string
                  serial:
                    description: Serial is the key serial.
                    format: int64
                    minimum: 0
                    type: integer
                required:
                - id
                - issuedAt
                - name
                - serial
                type: object
              lastCreateAttemptTime:
                description: |-
                  LastCreateAttemptTime is when the controller last sent a key create
                  request. Orphaned keys are deleted only after a settle window from this
                  time.
                format: date-time
                type: string
              lastDriftReissueTime:
                description: |-
                  LastDriftReissueTime is when the controller last issued a key because
                  the Secret no longer held the current key.
                format: date-time
                type: string
              lastHandledTrigger:
                description: |-
                  LastHandledTrigger is the spec.rotation.trigger value that the
                  controller last acted on.
                maxLength: 63
                type: string
              nextRotationTime:
                description: NextRotationTime is when the next scheduled rotation
                  is due.
                format: date-time
                type: string
              nextSerial:
                description: |-
                  NextSerial is the serial of the next key create request. It never
                  decreases, so the controller never reuses a key name.
                format: int64
                minimum: 0
                type: integer
              observedGeneration:
                description: ObservedGeneration is the generation the controller last
                  processed.
                format: int64
                type: integer
              pendingKey:
                description: |-
                  PendingKey is set before every key create request and cleared after it.
                  While it is set, a create request can be in flight or already committed
                  in Coder.
                properties:
                  createAttemptTime:
                    description: CreateAttemptTime is when the controller wrote this
                      marker.
                    format: date-time
                    type: string
                  name:
                    description: Name is the Coder key name of the create request.
                    maxLength: 64
                    type: string
                  serial:
                    description: Serial is the key serial of the create request.
                    format: int64
                    minimum: 0
                    type: integer
                required:
                - createAttemptTime
                - name
                - serial
                type: object
              retiringKeys:
                description: RetiringKeys are replaced keys that wait for deletion
                  in Coder.
                items:
                  description: |-
                    CoderAIGatewayKeyRetiring records a replaced key that waits for deletion in
                    Coder. It holds no secret data and nothing derived from it.
                  properties:
                    id:
                      description: ID is the Coder key ID. It is not the key.
                      format: uuid
                      maxLength: 36
                      type: string
                    name:
                      description: Name is the Coder key name.
                      maxLength: 64
                      type: string
                    replacedAt:
                      description: |-
                        ReplacedAt is when a newer key replaced this key in the Secret. The
                        grace period counts from this time.
                      format: date-time
                      type: string
                    serial:
                      description: Serial is the key serial.
                      format: int64
                      minimum: 0
                      type: integer
                  required:
                  - id
                  - name
                  - replacedAt
                  - serial
                  type: object
                maxItems: 3
                type: array
                x-kubernetes-list-map-keys:
                - serial
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
