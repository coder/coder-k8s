---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: codertemplatetests.coder.com
spec:
  group: coder.com
  names:
    kind: CoderTemplateTest
    listKind: CoderTemplateTestList
    plural: codertemplatetests
    singular: codertemplatetest
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.template
      name: Template
      type: string
    - jsonPath: .status.templateVersionName
      name: Version
      type: string
    - jsonPath: .status.reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          CoderTemplateTest tests one Coder template version like a Job: the
          controller creates a throwaway workspace, waits until every top-level agent
          is ready, deletes the workspace, and records Succeeded or Failed. The spec
          is immutable, so one object is one run.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: CoderTemplateTestSpec defines one test run of a Coder template
              version.
            properties:
              controlPlaneRef:
                description: |-
                  ControlPlaneRef names the CoderControlPlane in the same namespace. The
                  controller calls Coder with that control plane's operator token.
                properties:
                  name:
                    description: Name is the CoderControlPlane name.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
              parameters:
                description: Parameters are rich parameter values for the start build.
                items:
                  description: |-
                    CoderTemplateTestParameter is one rich parameter value for the start build.
                    Values are stored in plain text, so never put secrets here.
                  properties:
                    name:
                      description: Name is the parameter name.
                      maxLength: 128
                      minLength: 1
                      type: string
                    value:
                      description: Value is the parameter value.
                      maxLength: 4096
                      type: string
                  required:
                  - name
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              template:
                description: |-
                  Template is the Coder template as <organization>.<template>, the same
                  format as aggregated CoderTemplate names. Each name has at most 32
                  characters and is not one of Coder's reserved names new or create.
                maxLength: 65
                pattern: ^[a-zA-Z0-9]+(-[a-zA-Z0-9]+)*\.[a-zA-Z0-9]+(-[a-zA-Z0-9]+)*$
                type: string
                x-kubernetes-validations:
                - message: organization and template names must each have at most
                    32 characters
                  rule: self.matches('^[^.]{1,32}[.][^.]{1,32}$')
                - message: organization and template names must not be new or create
                  rule: '!self.matches(''^(new|create)[.]'') && !self.matches(''[.](new|create)$'')'
              timeoutSeconds:
                default: 900
                description: |-
                  TimeoutSeconds bounds the whole run: waiting for inputs, the start
                  build, agent readiness, and the delete build. Cleanup continues after
                  the deadline.
                format: int32
                maximum: 7200
                minimum: 60
                type: integer
              ttlSecondsAfterFinished:
                description: |-
                  TTLSecondsAfterFinished deletes the test this long after it finished
                  and its workspace is gone, like Job. Do not set it under GitOps: the
                  GitOps tool recreates the deleted object, which runs the test again.
                format: int32
                minimum: 0
                type: integer
              version:
                description: Version selects the template version under test.
                properties:
                  active:
                    description: |-
                      Active selects the template's active version when the test starts. The
                      controller resolves it once and records the version, so a later
                      promotion does not change the version under test.
                    type: boolean
                  id:
                    description: ID is the UUID of a version of the template.
                    format: uuid
                    maxLength: 36
                    type: string
                  name:
                    description: |-
                      Name is the name of a version of the template. It follows Coder's
                      template version name rules.
                    maxLength: 64
                    minLength: 1
                    pattern: ^[a-zA-Z0-9]+([_.-][a-zA-Z0-9]+)*$
                    type: string
                type: object
                x-kubernetes-validations:
                - message: set exactly one of name, id, or active
                  rule: '(has(self.name) ? 1 : 0) + (has(self.id) ? 1 : 0) + (has(self.active)
                    ? 1 : 0) == 1'
                - message: active must be true when set
                  rule: '!has(self.active) || self.active'
            required:
            - controlPlaneRef
            - template
            - version
            type: object
            x-kubernetes-validations:
            - message: spec is immutable, create a new CoderTemplateTest
              rule: self == oldSelf
          status:
            description: CoderTemplateTestStatus defines the observed state of a CoderTemplateTest.
            properties:
              agentsReadyTime:
                description: AgentsReadyTime is when every top-level agent was ready.
                format: date-time
                type: string
              completionTime:
                description: CompletionTime is when the phase became final.
                format: date-time
                type: string
              conditions:
                description: Conditions are Ready, Reconciling, Stalled, and WorkspaceDeleted.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              createAttemptTime:
                description: |-
                  CreateAttemptTime is set before every workspace create request. While it
                  is set and WorkspaceID is empty, a create request can be in flight or
                  already committed in Coder.
                format: date-time
                type: string
              deleteAttempts:
                description: DeleteAttempts counts failed delete builds. It drives
                  the retry backoff.
                format: int32
                type: integer
              deleteBuildID:
                description: DeleteBuildID is the ID of the current delete build.
                type: string
              message:
                description: |-
                  Message explains Reason. It never holds Coder error details, build
                  logs, parameter values, or tokens.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation the controller last
                  processed.
                format: int64
                type: integer
              organizationID:
                description: OrganizationID is the resolved Coder organization ID.
                type: string
              ownerID:
                description: OwnerID is the Coder user that owns the test workspace.
                type: string
              phase:
                description: |-
                  Phase is Pending, Running, Succeeded, or Failed. Succeeded and Failed
                  are final.
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                type: string
              reason:
                description: Reason is the current wait reason or the final result.
                type: string
              startBuildID:
                description: StartBuildID is the ID of the start build that the controller
                  requested.
                type: string
              startTime:
                description: StartTime is when the controller first processed the
                  test.
                format: date-time
                type: string
              templateID:
                description: TemplateID is the resolved Coder template ID.
                type: string
              templateVersionID:
                description: TemplateVersionID is the pinned template version ID.
                type: string
              templateVersionName:
                description: TemplateVersionName is the name of the pinned template
                  version.
                type: string
              workspaceID:
                description: WorkspaceID is the Coder workspace ID.
                type: string
              workspaceName:
                description: WorkspaceName is the deterministic Coder workspace name
                  of this test.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
