---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: coderworkspacepoolmembers.coder.com
spec:
  group: coder.com
  names:
    kind: CoderWorkspacePoolMember
    listKind: CoderWorkspacePoolMemberList
    plural: coderworkspacepoolmembers
    singular: coderworkspacepoolmember
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.poolName
      name: Pool
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.workspaceName
      name: Workspace
      type: string
    - jsonPath: .spec.claimRef.name
      name: Claim
      type: string
    - jsonPath: .status.reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          CoderWorkspacePoolMember is one workspace of a CoderWorkspacePool (#153).
          The pool controller creates members. Each member creates, watches, and
          deletes its own Coder workspace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              CoderWorkspacePoolMemberSpec holds the inputs that a member pinned from its
              pool's status.resolved. Only claimRef changes after creation, and only
              once. Every ID is a UUID in lower case with hyphens, as Coder writes it.
            properties:
              claimRef:
                description: |-
                  ClaimRef is the claim that holds this member. The pool sets it once,
                  when it binds a ready member.
                properties:
                  name:
                    description: Name is the claim name, in the member's namespace.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  uid:
                    description: UID is the claim's metadata.uid.
                    maxLength: 36
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                    type: string
                required:
                - name
                - uid
                type: object
              controlPlaneRef:
                description: ControlPlaneRef names the pool's CoderControlPlane.
                properties:
                  name:
                    description: Name is the CoderControlPlane name.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: controlPlaneRef is immutable
                  rule: self == oldSelf
              organizationID:
                description: OrganizationID is the template's organization.
                maxLength: 36
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                type: string
                x-kubernetes-validations:
                - message: organizationID is immutable
                  rule: self == oldSelf
              ownerID:
                description: |-
                  OwnerID is the Coder user who owns the workspace. Coder's prebuilds
                  system user is refused.
                maxLength: 36
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                type: string
                x-kubernetes-validations:
                - message: ownerID is immutable
                  rule: self == oldSelf
                - message: ownerID must not be the Coder prebuilds system user
                  rule: self != 'c42fdf75-3097-471c-8c33-fb52454d81c0'
              parameters:
                description: |-
                  Parameters are the rich parameter values of the start build, in plain
                  text. Leave the field out when there are none: typed clients drop an
                  empty list, and the immutability rule would then refuse their updates.
                items:
                  description: |-
                    CoderWorkspacePoolMemberParameter is one pinned rich parameter value.
                    Value is required and always serialized, so an empty value looks the same
                    in a stored object and in a typed update, and the immutability rule holds.
                  properties:
                    name:
                      description: Name is the parameter name.
                      maxLength: 128
                      minLength: 1
                      type: string
                    value:
                      description: Value is the parameter value. It can be empty.
                      maxLength: 4096
                      type: string
                  required:
                  - name
                  - value
                  type: object
                maxItems: 64
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              parametersHash:
                description: |-
                  ParametersHash is the pool's hash of Parameters when it created the
                  member.
                maxLength: 128
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: parametersHash is immutable
                  rule: self == oldSelf
              poolName:
                description: PoolName is the name of the member's CoderWorkspacePool.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
                x-kubernetes-validations:
                - message: poolName is immutable
                  rule: self == oldSelf
              presetID:
                description: PresetID is the preset of the start build.
                maxLength: 36
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                type: string
              readyTimeoutSeconds:
                description: |-
                  ReadyTimeoutSeconds bounds the time from the member's creation until
                  its workspace is ready.
                format: int32
                maximum: 7200
                minimum: 60
                type: integer
                x-kubernetes-validations:
                - message: readyTimeoutSeconds is immutable
                  rule: self == oldSelf
              templateID:
                description: TemplateID is the template.
                maxLength: 36
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                type: string
                x-kubernetes-validations:
                - message: templateID is immutable
                  rule: self == oldSelf
              templateVersionID:
                description: TemplateVersionID is the version of the start build.
                maxLength: 36
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                type: string
                x-kubernetes-validations:
                - message: templateVersionID is immutable
                  rule: self == oldSelf
            required:
            - controlPlaneRef
            - organizationID
            - ownerID
            - parametersHash
            - poolName
            - readyTimeoutSeconds
            - templateID
            - templateVersionID
            type: object
            x-kubernetes-validations:
            - message: presetID is immutable
              rule: has(self.presetID) == has(oldSelf.presetID) && (!has(self.presetID)
                || self.presetID == oldSelf.presetID)
            - message: parameters are immutable
              rule: has(self.parameters) == has(oldSelf.parameters) && (!has(self.parameters)
                || self.parameters == oldSelf.parameters)
            - message: claimRef can be set once
              rule: '!has(oldSelf.claimRef) || (has(self.claimRef) && self.claimRef
                == oldSelf.claimRef)'
          status:
            description: |-
              CoderWorkspacePoolMemberStatus defines the observed state of a
              CoderWorkspacePoolMember.
            properties:
              bindExtendDeadline:
                description: |-
                  BindExtendDeadline is the deadline that the extension at bind asks
                  Coder for. The controller stores it before the first extend request.
                  While BindExtended is false, a Coder deadline at or after it proves
                  that the extension happened.
                format: date-time
                type: string
              bindExtended:
                description: BindExtended is true after the one deadline extension
                  at bind.
                type: boolean
              conditions:
                description: Conditions are Ready, Used, and WorkspaceDeleted.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              createAttemptTime:
                description: |-
                  CreateAttemptTime is set before every workspace create request. While
                  it is set and WorkspaceID is empty, a create request can be in flight
                  or already committed in Coder.
                format: date-time
                type: string
              deleteAttempts:
                description: DeleteAttempts counts failed delete builds. It drives
                  the retry backoff.
                format: int32
                type: integer
              deleteBuildID:
                description: DeleteBuildID is the ID of the current delete build.
                type: string
              lastExtendTime:
                description: |-
                  LastExtendTime is when the controller last extended the autostop
                  deadline of the unclaimed workspace.
                format: date-time
                type: string
              message:
                description: |-
                  Message explains Reason. It never holds Coder error details, build
                  logs, parameter values, or tokens.
                type: string
              phase:
                description: Phase is Pending, Creating, Ready, Failed, or Deleting.
                enum:
                - Pending
                - Creating
                - Ready
                - Failed
                - Deleting
                type: string
              readyLastUsedAt:
                description: |-
                  ReadyLastUsedAt is the workspace's last_used_at when it became ready,
                  in microseconds like Coder. A later value counts as use. It comes from
                  use, or from a template schedule update with
                  update_workspace_last_used_at, which looks the same.
                format: date-time
                type: string
              readyTime:
                description: ReadyTime is when the workspace became ready.
                format: date-time
                type: string
              reason:
                description: Reason is the current wait reason or the failure reason.
                type: string
              startBuildID:
                description: StartBuildID is the ID of the start build that the controller
                  requested.
                type: string
              workspaceID:
                description: WorkspaceID is the Coder workspace ID.
                type: string
              workspaceName:
                description: |-
                  WorkspaceName is the Coder workspace name: kwp- and the first 28 hex
                  characters of the member's UID.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
