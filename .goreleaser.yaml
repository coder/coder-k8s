version: 2

project_name: coder-k8s

# dist/ holds the tracked install bundle (dist/install.yaml), and `release --clean` deletes the output
# directory, which leaves git dirty and fails the release. Keep GoReleaser output elsewhere.
dist: .goreleaser-dist

before:
  hooks:
    - go mod tidy
    - go mod vendor

builds:
  - id: coder-k8s
    main: ./
    binary: coder-k8s
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md

release:
  disable: '{{ eq (index .Env "GORELEASER_CHANNEL") "main" }}'

dockers_v2:
  - id: coder-k8s-image-main
    disable: '{{ ne (index .Env "GORELEASER_CHANNEL") "main" }}'
    dockerfile: Dockerfile.goreleaser
    ids:
      - coder-k8s
    images:
      - ghcr.io/coder/coder-k8s
    tags:
      - main
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: true
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.source: https://github.com/coder/coder-k8s
      org.opencontainers.image.url: https://coder.github.io/coder-k8s/
      org.opencontainers.image.documentation: https://coder.github.io/coder-k8s/
      org.opencontainers.image.title: coder-k8s
      org.opencontainers.image.description: Kubernetes operator for Coder
      org.opencontainers.image.version: main
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.vendor: Coder
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.authors: Coder
    flags:
      - "--pull=true"
      - "--provenance=false"

  - id: coder-k8s-image-release
    disable: '{{ eq (index .Env "GORELEASER_CHANNEL") "main" }}'
    dockerfile: Dockerfile.goreleaser
    ids:
      - coder-k8s
    images:
      - ghcr.io/coder/coder-k8s
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: true
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.source: https://github.com/coder/coder-k8s
      org.opencontainers.image.url: https://coder.github.io/coder-k8s/
      org.opencontainers.image.documentation: https://coder.github.io/coder-k8s/
      org.opencontainers.image.title: coder-k8s
      org.opencontainers.image.description: Kubernetes operator for Coder
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.vendor: Coder
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.authors: Coder
    flags:
      - "--pull=true"
      - "--provenance=false"

changelog:
  # The main channel's synthetic tag exists only in the CI checkout.
  disable: '{{ eq (index .Env "GORELEASER_CHANNEL") "main" }}'
  use: github
